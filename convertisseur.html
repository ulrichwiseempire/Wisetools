<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiseTools 🛠️ - Convertisseur FCFA & Devises</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #059669;
            --input-bg: #334155;
            --border: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: bold; color: var(--accent); }
        .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

        .ad-space {
            width: 100%;
            min-height: 80px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed var(--border);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-size: 12px;
            margin: 15px 0;
            text-align: center;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }

        input, select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff;
            padding: 14px;
            font-size: 16px;
            outline: none;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn:hover { background: var(--accent-hover); }

        .result-box {
            margin-top: 20px;
            padding: 18px;
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid var(--accent);
            border-radius: 14px;
            text-align: center;
        }

        .result-val {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent);
            margin-top: 5px;
        }

        .nav-links {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
        }
        .nav-links a { color: var(--accent); text-decoration: none; }

        .footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: auto; padding: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">WiseTools 🛠️</div>
            <div class="subtitle">Convertisseur rapide FCFA ↔ Devises</div>
        </div>

        <!-- 💰 BANNIÈRE PUB HAUT 💰 -->
        <div class="ad-space">📢 Espace Publicitaire (AdSense)</div>

        <div class="form-group">
            <label for="montant">Montant à convertir :</label>
            <input type="number" id="montant" placeholder="Ex: 10000" value="10000" oninput="convertir()">
        </div>

        <div class="grid-2 form-group">
            <div>
                <label for="deSource">De :</label>
                <select id="deSource" onchange="convertir()">
                    <option value="XOF">FCFA (XOF/XAF)</option>
                    <option value="EUR">Euro (€)</option>
                    <option value="USD">Dollar ($)</option>
                    <option value="NGN">Naira (🇳🇬)</option>
                    <option value="GHS">Cedi (🇬🇭)</option>
                </select>
            </div>
            <div>
                <label for="versCible">Vers :</label>
                <select id="versCible" onchange="convertir()">
                    <option value="EUR">Euro (€)</option>
                    <option value="XOF">FCFA (XOF/XAF)</option>
                    <option value="USD">Dollar ($)</option>
                    <option value="NGN">Naira (🇳🇬)</option>
                    <option value="GHS">Cedi (🇬🇭)</option>
                </select>
            </div>
        </div>

        <div class="result-box">
            <div style="font-size: 13px; color: var(--text-muted);">Résultat de la conversion</div>
            <div id="resultat" class="result-val">15.24 €</div>
        </div>

        <!-- 💰 BANNIÈRE PUB BAS 💰 -->
        <div class="ad-space">📢 Espace Publicitaire (AdSense)</div>

        <div class="nav-links">
            <a href="index.html">← Retour au Calculateur de Moyenne</a>
        </div>
    </div>

    <div class="footer">Projet propulsé par <b>WiseEmpire</b> 🍃</div>

    <script>
        // Taux approximatifs par rapport à 1 Euro (€)
        const tauxEUR = {
            "EUR": 1,
            "XOF": 655.957,
            "USD": 1.09,
            "NGN": 1650,
            "GHS": 16.5
        };

        function convertir() {
            const montant = parseFloat(document.getElementById('montant').value);
            const de = document.getElementById('deSource').value;
            const vers = document.getElementById('versCible').value;

            if (isNaN(montant) || montant < 0) {
                document.getElementById('resultat').innerText = "0.00";
                return;
            }

            // Conversion via pivot Euro
            const montantEnEUR = montant / tauxEUR[de];
            const resultatFinal = montantEnEUR * tauxEUR[vers];

            const symboles = { "EUR": "€", "XOF": "FCFA", "USD": "$", "NGN": "🇳🇬 ₦", "GHS": "🇬🇭 GH₵" };

            document.getElementById('resultat').innerText = `${resultatFinal.toFixed(2)} ${symboles[vers]}`;
        }

        // Calcul direct au chargement
        convertir();
    </script>
</body>
  </html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiseTools 🛠️ - Générateur de CV Express</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #059669;
            --input-bg: #334155;
            --border: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: bold; color: var(--accent); }
        .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }

        input, textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            outline: none;
        }

        textarea { resize: vertical; min-height: 60px; }

        .btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        /* Preview CV 100% Professionnel & Formel */
        #printableCV {
            display: none;
            background: #ffffff;
            color: #1e293b;
            padding: 30px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .cv-header { 
            border-bottom: 2px solid #0f172a; 
            padding-bottom: 12px; 
            margin-bottom: 20px; 
        }
        .cv-name { font-size: 24px; font-weight: 800; color: #0f172a; text-transform: uppercase; letter-spacing: 1px; }
        .cv-title { font-size: 15px; color: #059669; font-weight: 700; margin-top: 3px; }
        .cv-contact { font-size: 12px; color: #475569; margin-top: 6px; font-weight: 500; }

        .cv-section { margin-bottom: 18px; }
        .cv-section-title { 
            font-size: 13px; 
            font-weight: 700; 
            color: #0f172a; 
            border-bottom: 1px solid #e2e8f0; 
            padding-bottom: 3px; 
            margin-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .cv-text { font-size: 13px; color: #334155; white-space: pre-line; line-height: 1.6; }

        .nav-links { text-align: center; margin-top: 15px; font-size: 13px; }
        .nav-links a { color: var(--accent); text-decoration: none; }

        @media print {
            body * { visibility: hidden; }
            #printableCV, #printableCV * { visibility: visible; }
            #printableCV { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">WiseTools 🛠️</div>
            <div class="subtitle">Générateur de CV Express</div>
        </div>

        <div class="form-group">
            <label>Nom & Prénom :</label>
            <input type="text" id="cvNom" placeholder="Ex: KOFFI Ulrich">
        </div>

        <div class="form-group">
            <label>Titre / Poste recherché :</label>
            <input type="text" id="cvPoste" placeholder="Ex: Étudiant en Psychologie du travail">
        </div>

        <div class="form-group">
            <label>Contact (Téléphone / Émail / Ville) :</label>
            <input type="text" id="cvContact" placeholder="Ex: 97 81 73 76 | ulrich@gmail.com | Lomé">
        </div>

        <div class="form-group">
            <label>Profil / À propos de moi :</label>
            <textarea id="cvProfil" placeholder="Ex: Jeune diplômé motivé et rigoureux..."></textarea>
        </div>

        <div class="form-group">
            <label>Formations & Diplômes :</label>
            <textarea id="cvEtudes" placeholder="Ex: 2024 - Licence en Psychologie&#10;2023 - BAC&#10;2020 - BEPC"></textarea>
        </div>

        <div class="form-group">
            <label>Expériences Professionnelles & Stages :</label>
            <textarea id="cvExp" placeholder="Ex: Stage chez WiseEmpire (3 ans)..."></textarea>
        </div>

        <div class="form-group">
            <label>Compétences :</label>
            <textarea id="cvSkills" placeholder="Ex: Gestion de projets, Informatique, Analyse de données"></textarea>
        </div>

        <div class="form-group">
            <label>Langues maîtrisées :</label>
            <textarea id="cvLangues" placeholder="Ex: Français (Courant)&#10;Anglais (Intermédiaire)"></textarea>
        </div>

        <button class="btn" onclick="genererCV()">Générer Mon CV 📄</button>

        <!-- ZONE PREVIEW CV FORMEL -->
        <div id="printableCV">
            <div class="cv-header">
                <div class="cv-name" id="outNom"></div>
                <div class="cv-title" id="outPoste"></div>
                <div class="cv-contact" id="outContact"></div>
            </div>

            <div class="cv-section" id="secProfil">
                <div class="cv-section-title">Profil</div>
                <div class="cv-text" id="outProfil"></div>
            </div>

            <div class="cv-section" id="secEtudes">
                <div class="cv-section-title">Formations & Diplômes</div>
                <div class="cv-text" id="outEtudes"></div>
            </div>

            <div class="cv-section" id="secExp">
                <div class="cv-section-title">Expériences Professionnelles</div>
                <div class="cv-text" id="outExp"></div>
            </div>

            <div class="cv-section" id="secSkills">
                <div class="cv-section-title">Compétences</div>
                <div class="cv-text" id="outSkills"></div>
            </div>

            <div class="cv-section" id="secLangues">
                <div class="cv-section-title">Langues</div>
                <div class="cv-text" id="outLangues"></div>
            </div>

            <button onclick="window.print()" style="margin-top:20px; width:100%; padding:12px; background:#0f172a; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">
                Télécharger le CV en PDF
            </button>
        </div>

        <div class="nav-links">
            <a href="index.html">🏠 Retour à l'Accueil WiseTools</a>
        </div>
    </div>

    <script>
        function genererCV() {
            document.getElementById('outNom').innerText = document.getElementById('cvNom').value || 'NOM PRÉNOM';
            document.getElementById('outPoste').innerText = document.getElementById('cvPoste').value || 'TITRE DU POSTE';
            document.getElementById('outContact').innerText = document.getElementById('cvContact').value || 'Téléphone | Émail | Ville';
            document.getElementById('outProfil').innerText = document.getElementById('cvProfil').value || 'Description du profil...';
            document.getElementById('outEtudes').innerText = document.getElementById('cvEtudes').value || 'Détail des diplômes...';
            document.getElementById('outExp').innerText = document.getElementById('cvExp').value || 'Détail des expériences...';
            document.getElementById('outSkills').innerText = document.getElementById('cvSkills').value || 'Liste des compétences...';
            document.getElementById('outLangues').innerText = document.getElementById('cvLangues').value || 'Langues pratiquées...';

            document.getElementById('printableCV').style.display = 'block';
        }
    </script>
</body>
    </html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5927695198443971"
     crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-5927695198443971">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiseTools 🛠️ - Générateur de CV Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --input-bg: #334155;
            --border: #475569;
            --cv-primary: #1e293b;
            --cv-bg-left: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: bold; color: var(--accent); }
        .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

        /* Emplacement Pub */
        .ad-space {
            width: 100%;
            min-height: 80px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed var(--border);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-size: 12px;
            margin: 15px 0;
            text-align: center;
        }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }

        input, textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            outline: none;
        }

        textarea { resize: vertical; min-height: 60px; }

        .btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        /* --- STYLES RENDU DU CV --- */
        #printableCV {
            display: none;
            background: #ffffff;
            color: #334155;
            width: 100%;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .cv-grid {
            display: grid;
            grid-template-columns: 35% 65%;
            min-height: 600px;
        }

        /* Colonne Gauche */
        .cv-left {
            background-color: var(--cv-bg-left);
            padding: 20px 15px;
            border-right: 1px solid #e2e8f0;
        }

        .profile-img-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--cv-primary);
            margin: 0 auto 5px auto;
            overflow: hidden;
            background: #cbd5e1;
            position: relative;
            cursor: move;
            touch-action: none; /* Permet la gestion tactile personnalisée */
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: center center;
            user-select: none;
            -webkit-user-drag: none;
        }

        .img-controls {
            text-align: center;
            margin-bottom: 15px;
        }

        .img-btn {
            background: #cbd5e1;
            border: none;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            margin: 0 2px;
        }

        .cv-left-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--cv-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
            margin-bottom: 8px;
            padding-bottom: 3px;
            border-bottom: 1px solid #cbd5e1;
        }

        .cv-left-content {
            font-size: 11px;
            line-height: 1.5;
            color: #475569;
            white-space: pre-line;
            word-break: break-word;
        }

        /* Colonne Droite */
        .cv-right {
            padding: 25px 20px;
            background: #ffffff;
        }

        .cv-header-right { margin-bottom: 20px; }

        .cv-fullname {
            font-size: 22px;
            font-weight: 900;
            color: var(--cv-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cv-jobtitle {
            font-size: 13px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
            border-bottom: 2px solid var(--cv-primary);
            padding-bottom: 6px;
        }

        .cv-right-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--cv-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        .cv-right-content {
            font-size: 12px;
            line-height: 1.5;
            color: #334155;
            white-space: pre-line;
        }

        .nav-links { text-align: center; margin-top: 15px; font-size: 13px; }
        .nav-links a { color: var(--accent); text-decoration: none; }

        @media print {
            body * { visibility: hidden; }
            #printableCV, #printableCV * { visibility: visible; }
            #printableCV {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                box-shadow: none;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">WiseTools 🛠️</div>
            <div class="subtitle">Générateur de CV Pro</div>
        </div>

        <!-- 💰 BANNIÈRE PUB HAUT 💰 -->
        <div class="ad-space no-print">📢 Espace Publicitaire (AdSense)</div>

        <!-- CHOIX PHOTO -->
        <div class="form-group">
            <label>Choisir votre photo dans la galerie :</label>
            <input type="file" id="cvPhotoInput" accept="image/*">
        </div>

        <div class="form-group">
            <label>Nom & Prénom :</label>
            <input type="text" id="cvNom" placeholder="Ex: KOFFI Ulrich">
        </div>

        <div class="form-group">
            <label>Titre du poste / Profession :</label>
            <input type="text" id="cvPoste" placeholder="Ex: GRAPHISTE / DESIGNER">
        </div>

        <div class="form-group">
            <label>Profil / À propos de moi :</label>
            <textarea id="cvProfil" placeholder="Ex: Graphiste créatif avec plus de 5 ans d'expérience..."></textarea>
        </div>

        <div class="form-group">
            <label>Contact (Téléphone, Email, Adresse) :</label>
            <textarea id="cvContact" placeholder="Ex: +228 97 81 73 76&#10;contact@siteweb.com&#10;Lomé, Togo"></textarea>
        </div>

        <div class="form-group">
            <label>Formations & Diplômes :</label>
            <textarea id="cvEtudes" placeholder="Ex: Licence en Design Visuel&#10;Université de Lomé (2020 - 2023)"></textarea>
        </div>

        <div class="form-group">
            <label>Expériences Professionnelles :</label>
            <textarea id="cvExp" placeholder="Ex: Responsable Design - WiseEmpire&#10;(2021 - Present)"></textarea>
        </div>

        <div class="form-group">
            <label>Compétences / Expertise :</label>
            <textarea id="cvSkills" placeholder="Ex: Design UI/UX&#10;Photoshop, Illustrator"></textarea>
        </div>

        <div class="form-group">
            <label>Langues maîtrisées :</label>
            <textarea id="cvLangues" placeholder="Ex: Français (Courant)&#10;Anglais (Intermédiaire)"></textarea>
        </div>

        <div class="form-group">
            <label>Références (Optionnel) :</label>
            <textarea id="cvRef" placeholder="Ex: M. Koffi Eric - Directeur WiseEmpire&#10;Tél: +228 90 00 00 00"></textarea>
        </div>

        <button class="btn" onclick="genererCV()">Générer le CV 📄</button>

        <!-- ZONE RENDU CV -->
        <div id="printableCV">
            <div class="cv-grid">
                
                <!-- COLONNE GAUCHE -->
                <div class="cv-left">
                    <div class="profile-img-container" id="imgBox">
                        <img id="outPhoto" src="https://via.placeholder.com/150" alt="Photo de Profil">
                    </div>
                    <div class="img-controls no-print">
                        <span style="font-size:10px; color:#64748b; display:block;">👆 Glisse la photo avec le doigt</span>
                        <button class="img-btn" onclick="zoomImage(0.1)">🔍 +</button>
                        <button class="img-btn" onclick="zoomImage(-0.1)">🔍 -</button>
                    </div>

                    <div class="cv-left-title">Contact</div>
                    <div class="cv-left-content" id="outContact"></div>

                    <div class="cv-left-title">Éducation</div>
                    <div class="cv-left-content" id="outEtudes"></div>

                    <div class="cv-left-title">Expertise</div>
                    <div class="cv-left-content" id="outSkills"></div>

                    <div class="cv-left-title">Langues</div>
                    <div class="cv-left-content" id="outLangues"></div>
                </div>

                <!-- COLONNE DROITE -->
                <div class="cv-right">
                    <div class="cv-header-right">
                        <div class="cv-fullname" id="outNom">NOM PRÉNOM</div>
                        <div class="cv-jobtitle" id="outPoste">INTITULÉ DU POSTE</div>
                    </div>

                    <div class="cv-right-title">Profil</div>
                    <div class="cv-right-content" id="outProfil"></div>

                    <div class="cv-right-title">Expérience Professionnelle</div>
                    <div class="cv-right-content" id="outExp"></div>

                    <div class="cv-right-title" id="titleRef">Références</div>
                    <div class="cv-right-content" id="outRef"></div>
                </div>

            </div>

            <button class="no-print" onclick="window.print()" style="margin:15px; width:calc(100% - 30px); padding:12px; background:#0f172a; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">
                Télécharger le CV en PDF 🖨️
            </button>
        </div>

        <!-- 💰 BANNIÈRE PUB BAS 💰 -->
        <div class="ad-space no-print">📢 Espace Publicitaire (AdSense)</div>

        <div class="nav-links">
            <a href="index.html">🏠 Retour à l'Accueil WiseTools</a>
        </div>
    </div>

    <script>
        let uploadedPhotoBase64 = null;
        let imgScale = 1;
        let imgPosX = 0;
        let imgPosY = 0;

        document.getElementById('cvPhotoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    uploadedPhotoBase64 = evt.target.result;
                    imgScale = 1;
                    imgPosX = 0;
                    imgPosY = 0;
                    applyImgTransform();
                }
                reader.readAsDataURL(file);
            }
        });

        // --- GESTION DU GLISSER-DÉPOSER TACTILE & SOURIS ---
        const imgBox = document.getElementById('imgBox');
        const img = document.getElementById('outPhoto');
        let isDragging = false;
        let startX, startY;

        function startDrag(e) {
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX - imgPosX;
            startY = clientY - imgPosY;
        }

        function moveDrag(e) {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            imgPosX = clientX - startX;
            imgPosY = clientY - startY;
            applyImgTransform();
        }

        function endDrag() { isDragging = false; }

        imgBox.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', moveDrag);
        window.addEventListener('mouseup', endDrag);

        imgBox.addEventListener('touchstart', startDrag);
        window.addEventListener('touchmove', moveDrag);
        window.addEventListener('touchend', endDrag);

        function zoomImage(amount) {
            imgScale = Math.max(0.5, imgScale + amount);
            applyImgTransform();
        }

        function applyImgTransform() {
            img.style.transform = `translate(${imgPosX}px, ${imgPosY}px) scale(${imgScale})`;
        }

        function genererCV() {
            if (uploadedPhotoBase64) {
                document.getElementById('outPhoto').src = uploadedPhotoBase64;
            } else {
                document.getElementById('outPhoto').src = "https://ui-avatars.com/api/?name=" + encodeURIComponent(document.getElementById('cvNom').value || 'User') + "&background=1e293b&color=fff";
            }

            document.getElementById('outNom').innerText = document.getElementById('cvNom').value || 'ULRICH';
            document.getElementById('outPoste').innerText = document.getElementById('cvPoste').value || 'GRAPHISTE / DESIGNER';
            document.getElementById('outProfil').innerText = document.getElementById('cvProfil').value || 'Profil professionnel...';
            document.getElementById('outExp').innerText = document.getElementById('cvExp').value || 'Vos expériences...';

            const refVal = document.getElementById('cvRef').value;
            if(refVal.trim() === "") {
                document.getElementById('titleRef').style.display = 'none';
                document.getElementById('outRef').style.display = 'none';
            } else {
                document.getElementById('titleRef').style.display = 'block';
                document.getElementById('outRef').style.display = 'block';
                document.getElementById('outRef').innerText = refVal;
            }

            document.getElementById('outContact').innerText = document.getElementById('cvContact').value || 'Vos contacts...';
            document.getElementById('outEtudes').innerText = document.getElementById('cvEtudes').value || 'Vos formations...';
            document.getElementById('outSkills').innerText = document.getElementById('cvSkills').value || 'Vos compétences...';
            document.getElementById('outLangues').innerText = document.getElementById('cvLangues').value || 'Vos langues...';

            document.getElementById('printableCV').style.display = 'block';
        }
    </script>
</body>
</html>

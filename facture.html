<!DOCTYPE html>
<html lang="fr">
<head>
   <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5927695198443971"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiseTools 🛠️ - Générateur de Reçu Multi-Articles</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
            --input-bg: #334155;
            --border: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: bold; color: var(--accent); }
        .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

        .ad-space {
            width: 100%;
            min-height: 70px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed var(--border);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-size: 12px;
            margin: 15px 0;
            text-align: center;
        }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            outline: none;
        }

        /* Styles des lignes d'articles */
        .item-row {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            position: relative;
        }

        .item-row-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-add {
            background: transparent;
            border: 1px dashed var(--accent);
            color: var(--accent);
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .btn-remove {
            background: var(--danger);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            float: right;
        }

        .btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.2s;
        }
        .btn:hover { background: var(--accent-hover); }

        /* Preview Facture Imprimable */
        #printableInvoice {
            display: none;
            background: #ffffff;
            color: #000000;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        #printableInvoice h2 { text-align: center; color: #0f172a; margin-bottom: 5px; font-size: 18px; }
        .inv-header { display: flex; justify-content: space-between; border-bottom: 2px solid #ddd; padding-bottom: 10px; margin-bottom: 15px; font-size: 12px; }
        .inv-table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 13px; }
        .inv-table th, .inv-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .inv-table th { background: #f1f5f9; }
        .inv-total { text-align: right; font-size: 16px; font-weight: bold; color: #10b981; margin-top: 10px; }

        .nav-links { text-align: center; margin-top: 15px; font-size: 13px; }
        .nav-links a { color: var(--accent); text-decoration: none; }

        @media print {
            body * { visibility: hidden; }
            #printableInvoice, #printableInvoice * { visibility: visible; }
            #printableInvoice { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">WiseTools 🛠️</div>
            <div class="subtitle">Générateur de Reçu & Facture Multi-Articles</div>
        </div>

        <div class="ad-space">📢 Espace Publicitaire (AdSense)</div>

        <div class="form-group">
            <label for="vendeur">Nom de ton Entreprise / Boutique :</label>
            <input type="text" id="vendeur" placeholder="Ex: WiseEmpire">
        </div>

        <div class="form-group">
            <label for="client">Nom du Client :</label>
            <input type="text" id="client" placeholder="Ex: Ulrich">
        </div>

        <label style="margin-top:15px; display:block;">Liste des Articles :</label>
        
        <!-- Zone dynamique des articles -->
        <div id="itemsContainer">
            <div class="item-row">
                <input type="text" class="item-desc" placeholder="Nom de l'article (ex: Moto)">
                <div class="item-row-grid">
                    <input type="number" class="item-qty" placeholder="Qté" value="1" min="1">
                    <input type="number" class="item-price" placeholder="Prix Unitaire (FCFA)">
                </div>
            </div>
        </div>

        <button class="btn-add" onclick="ajouterLigneArticle()">+ Ajouter un autre article</button>

        <button class="btn" onclick="genererFacture()">Générer le Reçu 📄</button>

        <!-- ZONE DE FACTURE GENEREE -->
        <div id="printableInvoice">
            <h2>REÇU DE PAIEMENT</h2>
            <div class="inv-header">
                <div>
                    <strong>Émetteur:</strong> <span id="outVendeur"></span><br>
                    <strong>Date:</strong> <span id="outDate"></span>
                </div>
                <div style="text-align: right;">
                    <strong>Client:</strong> <span id="outClient"></span>
                </div>
            </div>

            <table class="inv-table">
                <thead>
                    <tr>
                        <th>Désignation</th>
                        <th>Qté</th>
                        <th>P.U</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="outTableBody">
                    <!-- Généré dynamiquement en JS -->
                </tbody>
            </table>

            <div class="inv-total">TOTAL PAYÉ : <span id="outTotal"></span> FCFA</div>

            <button onclick="window.print()" style="margin-top:20px; width:100%; padding:10px; background:#0f172a; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">
                🖨️ Imprimer ou Sauvegarder en PDF
            </button>
        </div>

        <div class="ad-space">📢 Espace Publicitaire (AdSense)</div>

        <div class="nav-links">
            <a href="index.html">🏠 Retour à l'Accueil WiseTools</a>
        </div>
    </div>

    <script>
        function ajouterLigneArticle() {
            const container = document.getElementById('itemsContainer');
            const newRow = document.createElement('div');
            newRow.className = 'item-row';
            newRow.innerHTML = `
                <button class="btn-remove" onclick="this.parentElement.remove()">Supprimer</button>
                <input type="text" class="item-desc" placeholder="Nom de l'article">
                <div class="item-row-grid">
                    <input type="number" class="item-qty" placeholder="Qté" value="1" min="1">
                    <input type="number" class="item-price" placeholder="Prix Unitaire (FCFA)">
                </div>
            `;
            container.appendChild(newRow);
        }

        function genererFacture() {
            const vendeur = document.getElementById('vendeur').value || 'WiseEmpire';
            const client = document.getElementById('client').value || 'Client';
            const dateStr = new Date().toLocaleDateString('fr-FR');

            const descs = document.querySelectorAll('.item-desc');
            const qtys = document.querySelectorAll('.item-qty');
            const prices = document.querySelectorAll('.item-price');

            const tableBody = document.getElementById('outTableBody');
            tableBody.innerHTML = '';

            let grandTotal = 0;

            for (let i = 0; i < descs.length; i++) {
                const desc = descs[i].value || 'Article';
                const qty = parseInt(qtys[i].value) || 1;
                const price = parseFloat(prices[i].value) || 0;
                const totalRow = qty * price;

                grandTotal += totalRow;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${desc}</td>
                    <td>${qty}</td>
                    <td>${price.toLocaleString('fr-FR')}</td>
                    <td>${totalRow.toLocaleString('fr-FR')}</td>
                `;
                tableBody.appendChild(tr);
            }

            document.getElementById('outVendeur').innerText = vendeur;
            document.getElementById('outClient').innerText = client;
            document.getElementById('outDate').innerText = dateStr;
            document.getElementById('outTotal').innerText = grandTotal.toLocaleString('fr-FR');

            document.getElementById('printableInvoice').style.display = 'block';
        }
    </script>
</body>
</html>
